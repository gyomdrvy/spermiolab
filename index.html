<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spermiologie - BTS Biologie Médicale</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone pour compilation JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- VALEURS DE RÉFÉRENCE OMS (6e Édition - 2021) ---
    const OMS_NORMS = {
      volume: { min: 1.4, unit: 'mL', label: 'Volume d\'éjaculat' },
      concentration: { min: 15, unit: 'x10^6 / mL', label: 'Concentration en spermatozoïdes' },
      totalCount: { min: 39, unit: 'x10^6 / éjaculat', label: 'Nombre total de spermatozoïdes' },
      mobilityPR: { min: 30, unit: '%', label: 'Mobilité Progressive (PR)' },
      vitality: { min: 54, unit: '%', label: 'Vitalité (test éosine)' },
      typicalForms: { min: 4, unit: '%', label: 'Formes typiques (OMS strict)' }
    };

    const GRID_TYPES = {
      MALASSEZ: { name: 'Cellule de Malassez', totalRectangles: 100, unitVol: 0.01 },
      THOMA: { name: 'Cellule de Thoma', totalRectangles: 16, unitVol: 0.00625 },
      LEMAUR: { name: 'Cellule de Lemaur', totalRectangles: 10, unitVol: 0.01 }
    };

    function TermBadge({ term, desc }) {
      return (
        <div className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
          <div className="font-bold text-slate-200">{term}</div>
          <div className="text-slate-400 text-[11px]">{desc}</div>
        </div>
      );
    }

    // --- DASHBOARD ---
    function DashboardModule() {
      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="bg-gradient-to-r from-teal-900/40 via-slate-800 to-indigo-900/40 p-5 md:p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 className="text-xl md:text-2xl font-bold text-teal-300 mb-2">
              📖 Normes OMS 2021 (6ᵉ édition) & Rappels
            </h2>
            <p className="text-xs md:text-sm text-slate-300 leading-relaxed">
              Plateforme d'entraînement interactive à la spermiologie clinique pour les étudiants en <strong>BTS Biologie Médicale</strong>.
            </p>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
              <div className="text-[11px] text-slate-400">Concentration Seuil</div>
              <div className="text-lg font-bold text-teal-400 font-mono">≥ 15 M/mL</div>
              <div className="text-[10px] text-slate-400">Oligozoospermie si &lt; 15</div>
            </div>
            <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
              <div className="text-[11px] text-slate-400">Mobilité Progressive</div>
              <div className="text-lg font-bold text-indigo-400 font-mono">≥ 30 % PR</div>
              <div className="text-[10px] text-slate-400">Asthénozoospermie si &lt; 30</div>
            </div>
            <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
              <div className="text-[11px] text-slate-400">Vitalité (Éosine)</div>
              <div className="text-lg font-bold text-emerald-400 font-mono">≥ 54 %</div>
              <div className="text-[10px] text-slate-400">Nécrozoospermie si &lt; 54</div>
            </div>
            <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
              <div className="text-[11px] text-slate-400">Formes Typiques</div>
              <div className="text-lg font-bold text-amber-400 font-mono">≥ 4 %</div>
              <div className="text-[10px] text-slate-400">Tératozoospermie si &lt; 4</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-2">
              <h3 className="font-bold text-slate-200 text-xs border-b border-slate-700 pb-2">
                🧮 Formules Clés
              </h3>
              <div className="space-y-2 text-xs font-mono text-slate-300">
                <div className="bg-slate-900/60 p-2 rounded border border-slate-700/60">
                  <span className="text-teal-300 font-bold block">Concentration (C) :</span>
                  C = [ Nbr compté × Dilution ] / Volume Grille (mL)
                </div>
                <div className="bg-slate-900/60 p-2 rounded border border-slate-700/60">
                  <span className="text-emerald-300 font-bold block">Vitalité (%) :</span>
                  [ Nbr Vivants / Total (Vivants + Morts) ] × 100
                </div>
                <div className="bg-slate-900/60 p-2 rounded border border-slate-700/60">
                  <span className="text-amber-300 font-bold block">IAM (Spermocytogramme) :</span>
                  Total Anomalies / Nombre spz atypiques
                </div>
              </div>
            </div>

            <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-2">
              <h3 className="font-bold text-slate-200 text-xs border-b border-slate-700 pb-2">
                🔬 Lexique BTS Biologie Médicale
              </h3>
              <div className="grid grid-cols-2 gap-2 text-xs">
                <TermBadge term="Azoospermie" desc="0 spermatozoïde à l'éjaculat" />
                <TermBadge term="Oligozoospermie" desc="Concentration < 15 M/mL" />
                <TermBadge term="Asthénozoospermie" desc="Mobilité PR < 30%" />
                <TermBadge term="Nécrozoospermie" desc="Vitalité < 54%" />
                <TermBadge term="Tératozoospermie" desc="Formes typiques < 4%" />
                <TermBadge term="Aspermie" desc="Absence d'éjaculat" />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE 1 : CONCENTRATION ---
    function ConcentrationModule({ onSuccess }) {
      const [gridType, setGridType] = useState('MALASSEZ');
      const [dilution, setDilution] = useState(20);
      const [volumeEjaculate, setVolumeEjaculate] = useState(3.2);
      const [rectanglesCounted, setRectanglesCounted] = useState(10);
      const [spermPositions, setSpermPositions] = useState([]);
      const [clickCount, setClickCount] = useState(0);

      const [userSpermCount, setUserSpermCount] = useState('');
      const [userConc, setUserConc] = useState('');
      const [userTotal, setUserTotal] = useState('');
      const [userDiag, setUserDiag] = useState('');
      const [feedback, setFeedback] = useState(null);

      const generateNewExercise = () => {
        const grids = ['MALASSEZ', 'THOMA', 'LEMAUR'];
        const selectedGrid = grids[Math.floor(Math.random() * grids.length)];
        const dilOptions = [10, 20, 50];
        const randDil = dilOptions[Math.floor(Math.random() * dilOptions.length)];
        const randVol = parseFloat((1.5 + Math.random() * 3).toFixed(1));
        const randRect = selectedGrid === 'MALASSEZ' ? 10 : (selectedGrid === 'THOMA' ? 8 : 5);
        
        const realCount = Math.floor(Math.random() * 40) + 12;
        const positions = [];
        for (let i = 0; i < realCount; i++) {
          positions.push({
            id: `spz-conc-${i}`,
            x: (Math.sin(i * 14.7 + 3) * 0.4 + 0.5) * 80 + 10,
            y: (Math.cos(i * 19.3 + 7) * 0.4 + 0.5) * 80 + 10,
            angle: Math.floor(Math.random() * 360),
            clicked: false
          });
        }

        setGridType(selectedGrid);
        setDilution(randDil);
        setVolumeEjaculate(randVol);
        setRectanglesCounted(randRect);
        setSpermPositions(positions);
        setClickCount(0);
        setUserSpermCount('');
        setUserConc('');
        setUserTotal('');
        setUserDiag('');
        setFeedback(null);
      };

      useEffect(() => { generateNewExercise(); }, []);

      const handleSpermClick = (id) => {
        setSpermPositions(prev => prev.map(s => {
          if (s.id === id) {
            const nextState = !s.clicked;
            setClickCount(c => nextState ? c + 1 : c - 1);
            return { ...s, clicked: nextState };
          }
          return s;
        }));
      };

      const handleVerify = (e) => {
        e.preventDefault();
        const realCount = spermPositions.length;
        const unitVolMl = GRID_TYPES[gridType].unitVol * 1e-3;
        const totalVolMl = rectanglesCounted * unitVolMl;
        const concMillions = parseFloat(((realCount * dilution) / totalVolMl / 1e6).toFixed(2));
        const totalMillions = parseFloat((concMillions * volumeEjaculate).toFixed(2));
        
        let diag = 'Normozoospermie';
        if (concMillions === 0) diag = 'Azoospermie';
        else if (concMillions < OMS_NORMS.concentration.min) diag = 'Oligozoospermie';

        const parsedCount = parseInt(userSpermCount, 10);
        const parsedConc = parseFloat(userConc.replace(',', '.'));
        const parsedTotal = parseFloat(userTotal.replace(',', '.'));

        const isCountCorrect = parsedCount === realCount;
        const isConcCorrect = Math.abs(parsedConc - concMillions) < 0.5;
        const isTotalCorrect = Math.abs(parsedTotal - totalMillions) < 0.8;
        const isDiagCorrect = userDiag.trim().toLowerCase() === diag.toLowerCase();

        const isSuccess = isCountCorrect && isConcCorrect && isTotalCorrect && isDiagCorrect;
        setFeedback({ isSuccess, realCount, concMillions, totalMillions, diag });
        if (isSuccess) onSuccess();
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
            <h2 className="text-base font-bold text-teal-300">1. Numération Visuelle (Hématimétrie)</h2>
            <button onClick={generateNewExercise} className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">
              🔄 Nouvelle lame
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="lg:col-span-7 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <div className="text-xs text-slate-300 font-mono">Grille : {GRID_TYPES[gridType].name}</div>
              
              <div className="relative w-full aspect-square max-w-[340px] mx-auto bg-slate-950 rounded-xl border-2 border-teal-600/40 overflow-hidden flex items-center justify-center p-2 select-none shadow-inner">
                <svg className="absolute inset-0 w-full h-full stroke-teal-500/25">
                  <pattern id="gridP" width="10%" height="10%" patternUnits="userSpaceOnUse">
                    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(45, 212, 191, 0.2)" strokeWidth="1" />
                  </pattern>
                  <rect width="100%" height="100%" fill="url(#gridP)" />
                  <rect x="8%" y="8%" width="84%" height="84%" fill="none" stroke="rgba(45, 212, 191, 0.6)" strokeWidth="2" />
                </svg>

                <div className="relative w-full h-full">
                  {spermPositions.map((spz) => (
                    <div 
                      key={spz.id} 
                      onClick={() => handleSpermClick(spz.id)}
                      className="absolute cursor-pointer p-1.5 transform hover:scale-125 transition-all"
                      style={{ left: `${spz.x}%`, top: `${spz.y}%`, transform: `rotate(${spz.angle}deg)` }}
                    >
                      <div className="flex items-center">
                        <div className={`w-2.5 h-1.5 rounded-full border ${spz.clicked ? 'bg-amber-400 border-amber-200 ring-2 ring-amber-400' : 'bg-teal-200 border-slate-300'}`}></div>
                        <div className="w-3.5 h-[1px] bg-slate-400"></div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="absolute bottom-2 left-2 bg-slate-900/90 px-2 py-0.5 rounded text-[11px] font-mono text-amber-400 border border-slate-700">
                  Pointés : {clickCount}
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center text-[11px] font-mono">
                <div className="bg-slate-900/80 p-2 rounded border border-slate-700">Dilution: 1/{dilution}</div>
                <div className="bg-slate-900/80 p-2 rounded border border-slate-700">Vol: {volumeEjaculate} mL</div>
                <div className="bg-slate-900/80 p-2 rounded border border-slate-700">Zone: {rectanglesCounted} rect.</div>
              </div>
            </div>

            <div className="lg:col-span-5 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <form onSubmit={handleVerify} className="space-y-3 text-xs">
                <div>
                  <label className="block text-amber-400 font-semibold mb-1">1. Nombre de spz comptés (N) :</label>
                  <input type="number" value={userSpermCount} onChange={e=>setUserSpermCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-amber-300 font-mono" placeholder="Effectuez le comptage..." />
                </div>
                <div>
                  <label className="block text-teal-400 font-semibold mb-1">2. Concentration (× 10⁶ / mL) :</label>
                  <input type="number" step="0.01" value={userConc} onChange={e=>setUserConc(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-teal-300 font-mono" placeholder="ex: 24.5" />
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">3. Total éjaculat (× 10⁶) :</label>
                  <input type="number" step="0.01" value={userTotal} onChange={e=>setUserTotal(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200 font-mono" placeholder="ex: 78.4" />
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">4. Diagnostic Médical :</label>
                  <select value={userDiag} onChange={e=>setUserDiag(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                    <option value="">-- Diagnostic --</option>
                    <option value="Normozoospermie">Normozoospermie</option>
                    <option value="Oligozoospermie">Oligozoospermie</option>
                    <option value="Azoospermie">Azoospermie</option>
                  </select>
                </div>
                <button type="submit" className="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-2 rounded text-xs shadow-lg">Vérifier mes calculs</button>
              </form>

              {feedback && (
                <div className={`p-3 rounded border text-xs space-y-1 font-mono ${feedback.isSuccess ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' : 'bg-rose-950/60 border-rose-500 text-rose-200'}`}>
                  <div className="font-bold">{feedback.isSuccess ? '✓ Bravo ! Résultat exact.' : '✗ Inexactitude détectée.'}</div>
                  <div>• Réel compté : {feedback.realCount}</div>
                  <div>• Conc. attendue : {feedback.concMillions} M/mL</div>
                  <div>• Total attendu : {feedback.totalMillions} M</div>
                  <div>• Diagnostic : {feedback.diag}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE 2 : MOBILITÉ ---
    function MobilityModule({ onSuccess }) {
      const [spermList, setSpermList] = useState([]);
      const [isPlaying, setIsPlaying] = useState(true);
      const [userPrCount, setUserPrCount] = useState('');
      const [userNpCount, setUserNpCount] = useState('');
      const [userImCount, setUserImCount] = useState('');
      const [userPrPct, setUserPrPct] = useState('');
      const [userDiag, setUserDiag] = useState('');
      const [feedback, setFeedback] = useState(null);

      const generateNewExercise = () => {
        const total = 20;
        const pr = Math.floor(Math.random() * 11) + 2;
        const np = Math.floor(Math.random() * 6) + 2;
        const im = total - pr - np;

        const list = [];
        for (let i = 0; i < pr; i++) {
          const vx = (Math.random() - 0.5) * 2;
          const vy = (Math.random() - 0.5) * 2;
          const angle = Math.atan2(vy, vx) * (180 / Math.PI) + 180;
          list.push({ id: i, type: 'PR', x: Math.random()*70+15, y: Math.random()*70+15, vx, vy, angle });
        }
        for (let i = 0; i < np; i++) list.push({ id: pr+i, type: 'NP', x: Math.random()*70+15, y: Math.random()*70+15, vx: 0, vy: 0, angle: Math.random()*360 });
        for (let i = 0; i < im; i++) list.push({ id: pr+np+i, type: 'IM', x: Math.random()*70+15, y: Math.random()*70+15, vx: 0, vy: 0, angle: Math.random()*360 });

        setSpermList(list.sort(() => Math.random() - 0.5));
        setIsPlaying(true);
        setUserPrCount(''); setUserNpCount(''); setUserImCount(''); setUserPrPct(''); setUserDiag(''); setFeedback(null);
      };

      useEffect(() => { generateNewExercise(); }, []);

      useEffect(() => {
        if (!isPlaying) return;
        const interval = setInterval(() => {
          setSpermList(prev => prev.map(s => {
            if (s.type === 'PR') {
              let nx = s.x + s.vx, ny = s.y + s.vy;
              let nvx = (nx < 8 || nx > 92) ? -s.vx : s.vx;
              let nvy = (ny < 8 || ny > 92) ? -s.vy : s.vy;
              return { ...s, x: nx, y: ny, vx: nvx, vy: nvy, angle: Math.atan2(nvy, nvx) * (180/Math.PI) + 180 };
            } else if (s.type === 'NP') {
              return { ...s, angle: s.angle + (Math.random()-0.5)*40 };
            }
            return s;
          }));
        }, 80);
        return () => clearInterval(interval);
      }, [isPlaying]);

      const handleVerify = (e) => {
        e.preventDefault();
        const realPr = spermList.filter(s=>s.type==='PR').length;
        const realNp = spermList.filter(s=>s.type==='NP').length;
        const realIm = spermList.filter(s=>s.type==='IM').length;
        const realPct = parseFloat(((realPr / 20) * 100).toFixed(1));
        const expectedDiag = realPct < OMS_NORMS.mobilityPR.min ? 'Asthénozoospermie' : 'Mobilité Normale';

        const isSuccess = parseInt(userPrCount,10) === realPr &&
                          parseInt(userNpCount,10) === realNp &&
                          parseInt(userImCount,10) === realIm &&
                          Math.abs(parseFloat(userPrPct.replace(',','.')) - realPct) < 0.5 &&
                          userDiag.trim().toLowerCase() === expectedDiag.toLowerCase();

        setFeedback({ isSuccess, realPr, realNp, realIm, realPct, expectedDiag });
        if (isSuccess) onSuccess();
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
            <h2 className="text-base font-bold text-indigo-300">2. Cinétique de Mobilité (37°C)</h2>
            <button onClick={generateNewExercise} className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">🔄 Échantillon</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="lg:col-span-7 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <div className="flex justify-between items-center text-xs">
                <span className="text-indigo-300 font-semibold">Microscope en direct (Sur 20 spz)</span>
                <button onClick={() => setIsPlaying(!isPlaying)} className="px-2 py-1 bg-slate-900 border border-slate-700 rounded text-[11px]">
                  {isPlaying ? '⏸ Pause' : '▶ Lecture'}
                </button>
              </div>

              <div className="relative w-full aspect-square max-w-[340px] mx-auto bg-slate-950 rounded-full border-4 border-slate-700 overflow-hidden shadow-2xl flex items-center justify-center p-2 select-none">
                <div className="relative w-full h-full">
                  {spermList.map((spz) => (
                    <div key={spz.id} className="absolute transform" style={{ left: `${spz.x}%`, top: `${spz.y}%`, transform: `rotate(${spz.angle}deg)` }}>
                      <div className="flex items-center font-none">
                        <div className="w-2.5 h-1.5 rounded-full bg-indigo-200 border border-slate-300"></div>
                        <div className={`w-3.5 h-[1px] ${spz.type==='IM'?'bg-slate-500':'bg-indigo-300 animate-pulse'}`}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="text-[10px] text-center text-slate-400 space-x-2">
                <span>➔ <strong>PR</strong>: Trajectoire vers l'avant</span>
                <span>↻ <strong>NP</strong>: Sur place</span>
                <span>✖ <strong>IM</strong>: Immobile</span>
              </div>
            </div>

            <div className="lg:col-span-5 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <form onSubmit={handleVerify} className="space-y-3 text-xs">
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-emerald-400 font-semibold mb-1">PR (Nbr):</label>
                    <input type="number" value={userPrCount} onChange={e=>setUserPrCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded text-emerald-300 font-mono" />
                  </div>
                  <div>
                    <label className="block text-amber-400 font-semibold mb-1">NP (Nbr):</label>
                    <input type="number" value={userNpCount} onChange={e=>setUserNpCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded text-amber-300 font-mono" />
                  </div>
                  <div>
                    <label className="block text-rose-400 font-semibold mb-1">IM (Nbr):</label>
                    <input type="number" value={userImCount} onChange={e=>setUserImCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded text-rose-300 font-mono" />
                  </div>
                </div>

                <div>
                  <label className="block text-indigo-400 font-semibold mb-1">% Mobilité Progressive (PR %) :</label>
                  <input type="number" step="0.1" value={userPrPct} onChange={e=>setUserPrPct(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-indigo-300 font-mono" placeholder="ex: 45.0" />
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Diagnostic Médical :</label>
                  <select value={userDiag} onChange={e=>setUserDiag(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                    <option value="">-- Diagnostic --</option>
                    <option value="Mobilité Normale">Mobilité Normale (PR ≥ 30%)</option>
                    <option value="Asthénozoospermie">Asthénozoospermie (PR &lt; 30%)</option>
                  </select>
                </div>

                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded text-xs shadow-lg">Valider le décompte</button>
              </form>

              {feedback && (
                <div className={`p-3 rounded border text-xs space-y-1 font-mono ${feedback.isSuccess ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' : 'bg-rose-950/60 border-rose-500 text-rose-200'}`}>
                  <div className="font-bold">{feedback.isSuccess ? '✓ Décompte parfait !' : '✗ Décompte inexact.'}</div>
                  <div>• Réel : PR={feedback.realPr}, NP={feedback.realNp}, IM={feedback.realIm}</div>
                  <div>• PR attendu : {feedback.realPct} %</div>
                  <div>• Diagnostic : {feedback.expectedDiag}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE 3 : VITALITÉ ---
    function VitalityModule({ onSuccess }) {
      const [spermCells, setSpermCells] = useState([]);
      const [clickCount, setClickCount] = useState({ pink: 0, white: 0 });
      const [userDeadCount, setUserDeadCount] = useState('');
      const [userTotalCount, setUserTotalCount] = useState('');
      const [userVitalityPct, setUserVitalityPct] = useState('');
      const [userDiag, setUserDiag] = useState('');
      const [feedback, setFeedback] = useState(null);

      const generateNewExercise = () => {
        const total = 20;
        const dead = Math.floor(Math.random() * 13) + 2;
        const cells = [];
        for (let i = 0; i < total - dead; i++) cells.push({ id: i, isDead: false, x: Math.random()*75+10, y: Math.random()*75+10, angle: Math.floor(Math.random()*360), tagged: false });
        for (let i = 0; i < dead; i++) cells.push({ id: total - dead + i, isDead: true, x: Math.random()*75+10, y: Math.random()*75+10, angle: Math.floor(Math.random()*360), tagged: false });

        setSpermCells(cells.sort(() => Math.random() - 0.5));
        setClickCount({ pink: 0, white: 0 });
        setUserDeadCount(''); setUserTotalCount(''); setUserVitalityPct(''); setUserDiag(''); setFeedback(null);
      };

      useEffect(() => { generateNewExercise(); }, []);

      const handleCellClick = (id) => {
        setSpermCells(prev => prev.map(c => {
          if (c.id === id) {
            const next = !c.tagged;
            setClickCount(curr => ({
              ...curr,
              [c.isDead ? 'pink' : 'white']: c.tagged ? curr[c.isDead ? 'pink' : 'white'] - 1 : curr[c.isDead ? 'pink' : 'white'] + 1
            }));
            return { ...c, tagged: next };
          }
          return c;
        }));
      };

      const handleVerify = (e) => {
        e.preventDefault();
        const realDead = spermCells.filter(c=>c.isDead).length;
        const realAlive = 20 - realDead;
        const realPct = parseFloat(((realAlive / 20) * 100).toFixed(1));
        const expectedDiag = realPct < OMS_NORMS.vitality.min ? 'Nécrozoospermie' : 'Vitalité Normale';

        const isSuccess = parseInt(userDeadCount,10) === realDead &&
                          parseInt(userTotalCount,10) === 20 &&
                          Math.abs(parseFloat(userVitalityPct.replace(',','.')) - realPct) < 0.5 &&
                          userDiag.trim().toLowerCase() === expectedDiag.toLowerCase();

        setFeedback({ isSuccess, realDead, realAlive, realPct, expectedDiag });
        if (isSuccess) onSuccess();
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
            <h2 className="text-base font-bold text-emerald-300">3. Test de Vitalité (Éosine Y)</h2>
            <button onClick={generateNewExercise} className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">🔄 Champ</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="lg:col-span-7 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <div className="flex justify-between text-xs font-mono">
                <span className="text-rose-400">Roses (Morts) : {clickCount.pink}</span>
                <span className="text-slate-200">Blancs (Vivants) : {clickCount.white}</span>
              </div>

              <div className="relative w-full aspect-square max-w-[340px] mx-auto bg-rose-950/20 rounded-full border-4 border-slate-700 overflow-hidden shadow-2xl flex items-center justify-center p-2 select-none">
                <div className="relative w-full h-full">
                  {spermCells.map((cell) => (
                    <div key={cell.id} onClick={() => handleCellClick(cell.id)} className="absolute cursor-pointer transform hover:scale-125 transition-transform" style={{ left: `${cell.x}%`, top: `${cell.y}%`, transform: `rotate(${cell.angle}deg)` }}>
                      <div className="flex items-center">
                        <div className={`w-3 h-2 rounded-full border ${cell.isDead ? 'bg-rose-500 border-rose-300' : 'bg-slate-100 border-slate-300'} ${cell.tagged ? 'ring-2 ring-amber-400' : ''}`}></div>
                        <div className="w-4 h-[1px] bg-slate-400"></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="text-[10px] text-center text-slate-400 space-x-3">
                <span>⚪ Tête Blanche = Vivant</span>
                <span>🔴 Tête Rose = Mort</span>
              </div>
            </div>

            <div className="lg:col-span-5 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <form onSubmit={handleVerify} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-rose-400 font-semibold mb-1">Morts (Roses) :</label>
                    <input type="number" value={userDeadCount} onChange={e=>setUserDeadCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-rose-300 font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Total observés :</label>
                    <input type="number" value={userTotalCount} onChange={e=>setUserTotalCount(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200 font-mono" />
                  </div>
                </div>

                <div>
                  <label className="block text-emerald-400 font-semibold mb-1">% Vitalité calculé :</label>
                  <input type="number" step="0.1" value={userVitalityPct} onChange={e=>setUserVitalityPct(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-emerald-300 font-mono" placeholder="ex: 65.0" />
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Diagnostic Médical :</label>
                  <select value={userDiag} onChange={e=>setUserDiag(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                    <option value="">-- Diagnostic --</option>
                    <option value="Vitalité Normale">Vitalité Normale (≥ 54%)</option>
                    <option value="Nécrozoospermie">Nécrozoospermie (&lt; 54%)</option>
                  </select>
                </div>

                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs shadow-lg">Valider la Vitalité</button>
              </form>

              {feedback && (
                <div className={`p-3 rounded border text-xs space-y-1 font-mono ${feedback.isSuccess ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' : 'bg-rose-950/60 border-rose-500 text-rose-200'}`}>
                  <div className="font-bold">{feedback.isSuccess ? '✓ Test validé !' : '✗ Erreur de comptage.'}</div>
                  <div>• Morts réels : {feedback.realDead} | Vivants : {feedback.realAlive}</div>
                  <div>• Vitalité attendue : {feedback.realPct} %</div>
                  <div>• Diagnostic : {feedback.expectedDiag}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SPERMOCYTOGRAMME SVG & MODULE 4 ---
    function SpermSVG({ anomalies }) {
      const hasMacro = anomalies.includes('head_macro');
      const hasMicro = anomalies.includes('head_micro');
      const hasDoubleHead = anomalies.includes('head_double');
      const hasBentMid = anomalies.includes('mid_bent');
      const bgCytoplasmic = anomalies.includes('mid_res');
      const hasCoiledTail = anomalies.includes('tail_coiled');
      const hasDoubleTail = anomalies.includes('tail_double');

      let headScale = 1;
      if (hasMacro) headScale = 1.45;
      if (hasMicro) headScale = 0.65;

      return (
        <svg viewBox="0 0 160 80" className="w-full h-full">
          <g transform={`scale(${headScale}) translate(${hasMacro ? -12 : (hasMicro ? 15 : 0)}, ${hasMacro ? -6 : (hasMicro ? 8 : 0)})`}>
            {hasDoubleHead ? (
              <>
                <ellipse cx="32" cy="35" rx="8" ry="5" fill="#cbd5e1" stroke="#475569" strokeWidth="1.5" />
                <ellipse cx="32" cy="45" rx="8" ry="5" fill="#cbd5e1" stroke="#475569" strokeWidth="1.5" />
              </>
            ) : (
              <ellipse cx="32" cy="40" rx="9" ry="6" fill="#e2e8f0" stroke="#334155" strokeWidth="1.5" />
            )}
          </g>
          <g>
            {bgCytoplasmic && <circle cx="45" cy="40" r="5" fill="#f59e0b" opacity="0.8" />}
            {hasBentMid ? (
              <path d="M 40 40 L 48 40 L 44 55 L 56 55" fill="none" stroke="#64748b" strokeWidth="2.5" />
            ) : (
              <line x1="40" y1="40" x2="52" y2="40" stroke="#64748b" strokeWidth="2.5" />
            )}
          </g>
          <g>
            {hasCoiledTail ? (
              <path d="M 52 40 C 65 20, 80 60, 65 40 C 55 25, 75 25, 70 40" fill="none" stroke="#94a3b8" strokeWidth="1.5" />
            ) : hasDoubleTail ? (
              <>
                <path d="M 52 40 Q 90 30, 145 25" fill="none" stroke="#94a3b8" strokeWidth="1.5" />
                <path d="M 52 40 Q 90 50, 145 55" fill="none" stroke="#94a3b8" strokeWidth="1.5" />
              </>
            ) : (
              <path d={hasBentMid ? "M 56 55 Q 100 55, 150 40" : "M 52 40 Q 95 32, 150 40"} fill="none" stroke="#94a3b8" strokeWidth="1.5" />
            )}
          </g>
        </svg>
      );
    }

    function MorphologyModule({ onSuccess }) {
      const [frottis, setFrottis] = useState([]);
      const [selectedSpz, setSelectedSpz] = useState(null);
      const [userNormal, setUserNormal] = useState('');
      const [userHeadAnom, setUserHeadAnom] = useState('');
      const [userMidAnom, setUserMidAnom] = useState('');
      const [userTailAnom, setUserTailAnom] = useState('');
      const [userIam, setUserIam] = useState('');
      const [userDiag, setUserDiag] = useState('');
      const [feedback, setFeedback] = useState(null);

      const generateNewFrottis = () => {
        const list = [];
        for (let i = 1; i <= 10; i++) {
          const isNormal = Math.random() < 0.25;
          const anomalies = [];
          if (!isNormal) {
            if (Math.random() < 0.6) anomalies.push(['head_macro', 'head_micro', 'head_double'][Math.floor(Math.random()*3)]);
            if (Math.random() < 0.5) anomalies.push(['mid_bent', 'mid_res'][Math.floor(Math.random()*2)]);
            if (Math.random() < 0.5 || anomalies.length === 0) anomalies.push(['tail_coiled', 'tail_double'][Math.floor(Math.random()*2)]);
          }
          list.push({ id: i, isNormal, anomalies });
        }
        setFrottis(list);
        setSelectedSpz(list[0]);
        setUserNormal(''); setUserHeadAnom(''); setUserMidAnom(''); setUserTailAnom(''); setUserIam(''); setUserDiag(''); setFeedback(null);
      };

      useEffect(() => { generateNewFrottis(); }, []);

      const handleVerify = (e) => {
        e.preventDefault();
        const normalCount = frottis.filter(s => s.isNormal).length;
        const abnormalSpzCount = 10 - normalCount;
        let headAnomTotal = 0, midAnomTotal = 0, tailAnomTotal = 0;

        frottis.forEach(s => {
          s.anomalies.forEach(a => {
            if (a.startsWith('head_')) headAnomTotal++;
            if (a.startsWith('mid_')) midAnomTotal++;
            if (a.startsWith('tail_')) tailAnomTotal++;
          });
        });

        const sumAnomalies = headAnomTotal + midAnomTotal + tailAnomTotal;
        const realIam = abnormalSpzCount > 0 ? parseFloat((sumAnomalies / abnormalSpzCount).toFixed(2)) : 1.0;
        const expectedDiag = ((normalCount / 10) * 100) < OMS_NORMS.typicalForms.min ? 'Tératozoospermie' : 'Spermocytogramme Normal';

        const isSuccess = parseInt(userNormal,10) === normalCount &&
                          parseInt(userHeadAnom,10) === headAnomTotal &&
                          parseInt(userMidAnom,10) === midAnomTotal &&
                          parseInt(userTailAnom,10) === tailAnomTotal &&
                          Math.abs(parseFloat(userIam.replace(',','.')) - realIam) < 0.1 &&
                          userDiag.trim().toLowerCase() === expectedDiag.toLowerCase();

        setFeedback({ isSuccess, normalCount, headAnomTotal, midAnomTotal, tailAnomTotal, realIam, expectedDiag });
        if (isSuccess) onSuccess();
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
            <h2 className="text-base font-bold text-amber-300">4. Spermocytogramme & IAM</h2>
            <button onClick={generateNewFrottis} className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">🔄 Frottis</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="lg:col-span-7 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <div className="text-xs text-amber-300 font-semibold">Frottis (Cliquez pour observer)</div>

              <div className="grid grid-cols-5 gap-1.5">
                {frottis.map((s) => (
                  <div
                    key={s.id}
                    onClick={() => setSelectedSpz(s)}
                    className={`p-1.5 rounded border cursor-pointer bg-slate-950 flex flex-col items-center ${
                      selectedSpz?.id === s.id ? 'border-amber-400 ring-1 ring-amber-400' : 'border-slate-800'
                    }`}
                  >
                    <div className="w-full h-10"><SpermSVG anomalies={s.anomalies} /></div>
                    <span className="text-[9px] font-mono text-slate-400">N°{s.id}</span>
                  </div>
                ))}
              </div>

              {selectedSpz && (
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2">
                  <div className="text-xs font-bold text-amber-400">🔍 Loupe Spz N°{selectedSpz.id}</div>
                  <div className="w-full h-20 bg-slate-950 rounded border border-slate-800 p-1">
                    <SpermSVG anomalies={selectedSpz.anomalies} />
                  </div>
                </div>
              )}
            </div>

            <div className="lg:col-span-5 bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
              <form onSubmit={handleVerify} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-emerald-400 font-semibold mb-1">Typiques (Nbr):</label>
                    <input type="number" value={userNormal} onChange={e=>setUserNormal(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded font-mono text-emerald-300" />
                  </div>
                  <div>
                    <label className="block text-amber-400 font-semibold mb-1">Anom. Tête:</label>
                    <input type="number" value={userHeadAnom} onChange={e=>setUserHeadAnom(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded font-mono text-amber-300" />
                  </div>
                  <div>
                    <label className="block text-amber-400 font-semibold mb-1">Anom. Pièce:</label>
                    <input type="number" value={userMidAnom} onChange={e=>setUserMidAnom(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded font-mono text-amber-300" />
                  </div>
                  <div>
                    <label className="block text-amber-400 font-semibold mb-1">Anom. Flagelle:</label>
                    <input type="number" value={userTailAnom} onChange={e=>setUserTailAnom(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded font-mono text-amber-300" />
                  </div>
                </div>

                <div>
                  <label className="block text-teal-400 font-semibold mb-1">Calcul IAM :</label>
                  <input type="number" step="0.01" value={userIam} onChange={e=>setUserIam(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded font-mono text-teal-300" placeholder="ex: 1.40" />
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Diagnostic Morphologique :</label>
                  <select value={userDiag} onChange={e=>setUserDiag(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 p-2 rounded text-slate-200">
                    <option value="">-- Diagnostic --</option>
                    <option value="Spermocytogramme Normal">Spermocytogramme Normal</option>
                    <option value="Tératozoospermie">Tératozoospermie</option>
                  </select>
                </div>

                <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded text-xs shadow-lg">Valider le Spermocytogramme</button>
              </form>

              {feedback && (
                <div className={`p-3 rounded border text-xs space-y-1 font-mono ${feedback.isSuccess ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' : 'bg-rose-950/60 border-rose-500 text-rose-200'}`}>
                  <div className="font-bold">{feedback.isSuccess ? '✓ Spermocytogramme parfait !' : '✗ Analyse inexact.'}</div>
                  <div>• Typiques : {feedback.normalCount} / 10</div>
                  <div>• Anomalies: T={feedback.headAnomTotal}, P={feedback.midAnomTotal}, F={feedback.tailAnomTotal}</div>
                  <div>• IAM attendu : {feedback.realIam}</div>
                  <div>• Diagnostic : {feedback.expectedDiag}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [score, setScore] = useState(0);

      const handleSuccess = () => setScore(s => s + 10);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div>
                <h1 className="text-base md:text-lg font-bold text-teal-300">
                  🔬 Spermiologie BTS Biologie Médicale
                </h1>
                <p className="text-[10px] text-slate-400">Entraînement OMS 2021</p>
              </div>

              <div className="bg-slate-950 px-3 py-1 rounded-lg border border-slate-800 flex items-center space-x-1">
                <span className="text-xs text-slate-400">Score:</span>
                <span className="text-sm font-bold text-amber-300 font-mono">{score} pts</span>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-2 flex space-x-1 overflow-x-auto border-t border-slate-800/80 pt-1 text-xs">
              <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-t-lg font-semibold whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-slate-800 text-teal-300 border-t-2 border-teal-400' : 'text-slate-400'}`}>
                📖 Guide & OMS
              </button>
              <button onClick={() => setActiveTab('concentration')} className={`px-3 py-2 rounded-t-lg font-semibold whitespace-nowrap ${activeTab === 'concentration' ? 'bg-slate-800 text-teal-300 border-t-2 border-teal-400' : 'text-slate-400'}`}>
                1. Concentration
              </button>
              <button onClick={() => setActiveTab('mobility')} className={`px-3 py-2 rounded-t-lg font-semibold whitespace-nowrap ${activeTab === 'mobility' ? 'bg-slate-800 text-indigo-300 border-t-2 border-indigo-400' : 'text-slate-400'}`}>
                2. Mobilité
              </button>
              <button onClick={() => setActiveTab('vitality')} className={`px-3 py-2 rounded-t-lg font-semibold whitespace-nowrap ${activeTab === 'vitality' ? 'bg-slate-800 text-emerald-300 border-t-2 border-emerald-400' : 'text-slate-400'}`}>
                3. Vitalité
              </button>
              <button onClick={() => setActiveTab('morphology')} className={`px-3 py-2 rounded-t-lg font-semibold whitespace-nowrap ${activeTab === 'morphology' ? 'bg-slate-800 text-amber-300 border-t-2 border-amber-400' : 'text-slate-400'}`}>
                4. Cytogramme
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-3 md:p-6">
            {activeTab === 'dashboard' && <DashboardModule />}
            {activeTab === 'concentration' && <ConcentrationModule onSuccess={handleSuccess} />}
            {activeTab === 'mobility' && <MobilityModule onSuccess={handleSuccess} />}
            {activeTab === 'vitality' && <VitalityModule onSuccess={handleSuccess} />}
            {activeTab === 'morphology' && <MorphologyModule onSuccess={handleSuccess} />}
          </main>

          <footer className="bg-slate-900 border-t border-slate-800 py-3 text-center text-[10px] text-slate-500">
            BTS Biologie Médicale - Spermiologie Clinique
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
